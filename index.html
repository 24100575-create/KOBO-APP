        async function copyTextSafely(text) {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
              return true;
            }
          } catch (err) {}
          try {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(textarea);
            return ok;
          } catch (err) {
            return false;
          }
        }

                const drawIcon = (imgObj) => {
                  ctx.fillStyle = '#1D4ED8';
                  ctx.fillRect(0, 0, 512, 512);
                  if (imgObj) {
                    ctx.drawImage(imgObj, 0, 0, 512, 512);
                  } else {
                    const grad = ctx.createLinearGradient(0, 0, 512, 512);
                    grad.addColorStop(0, '#2563EB');
                    grad.addColorStop(1, '#312E81');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 512, 512);
                    ctx.font = '240px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🎳', 256, 268);
                  }
                  const iconUrl = iconCanvas.toDataURL('image/png');
                  const appleLink = document.getElementById('apple-touch-icon-link');
                  if (appleLink) appleLink.setAttribute('href', iconUrl);

                  const manifest = {
                    name: 'KOBO 볼링 클럽',
                    short_name: 'KOBO',
                    start_url: window.location.href,
                    display: 'standalone',
                    background_color: '#FFFFFF',
                    theme_color: '#FFFFFF',
                    icons: [
                      { src: iconUrl, sizes: '192x192', type: 'image/png' },
                      { src: iconUrl, sizes: '512x512', type: 'image/png' },
                    ],
                  };
                  const manifestBlob = new Blob([JSON.stringify(manifest)], {
                    type: 'application/manifest+json',
                  });
                  const manifestUrl = URL.createObjectURL(manifestBlob);
                  const manifestLink = document.getElementById('pwa-manifest-link');
                  if (manifestLink) manifestLink.setAttribute('href', manifestUrl);
                };

                if (clubLogo) {
                  const img = new Image();
                  img.onload = () => drawIcon(img);
                  img.onerror = () => drawIcon(null);
                  img.src = clubLogo;
                } else {
                  drawIcon(null);
                }
              }
            } catch (err) {}
          }, [clubLogo]);

          const handleTriggerAppInstall = async () => {
            if (deferredInstallPrompt) {
              deferredInstallPrompt.prompt();
              const choice = await deferredInstallPrompt.userChoice;
              if (choice && choice.outcome === 'accepted') {
                showToast('KOBO 앱 설치가 시작되었습니다!');
              }
              setDeferredInstallPrompt(null);
            } else {
              setShowInstallGuideModal(true);
            }
          };

          const applyPayload = (data) => {
            if (!data) return;
            if (typeof data.adminPin === 'string' && /^\d{4,8}$/.test(data.adminPin)) {
              setAdminPin(data.adminPin);
            }
            if (typeof data.clubLogo === 'string') setClubLogo(data.clubLogo);
            if (typeof data.duesAccount === 'string') setDuesAccount(data.duesAccount);
            if (typeof data.regularAccount === 'string') setRegularAccount(data.regularAccount);
            if (typeof data.presidentPhone === 'string') setPresidentPhone(data.presidentPhone);
            if (typeof data.vicePresidentPhone === 'string') setVicePresidentPhone(data.vicePresidentPhone);
            if (typeof data.currentSemesterName === 'string') setCurrentSemesterName(data.currentSemesterName);
            if (Array.isArray(data.archivedSemesters)) setArchivedSemesters(data.archivedSemesters);
            if (Array.isArray(data.members)) setMembers(data.members);
            if (Array.isArray(data.sessions) && data.sessions.length > 0) {
              setSessions(data.sessions);
              setActiveSessionId((prevId) =>
                data.sessions.some((s) => s.id === prevId)
                  ? prevId
                  : data.sessions[data.sessions.length - 1].id
              );
            }
            if (typeof data.shoeRentalFee === 'number') setShoeRentalFee(data.shoeRentalFee);
          };

          useEffect(() => {
            try {
              const raw = localStorage.getItem(LOCAL_CLUB_STORAGE_KEY);
              if (raw) applyPayload(JSON.parse(raw));
            } catch (err) {}

            if (!auth || !db) {
              setCloudStatus('offline');
              return;
            }
            auth
              .signInAnonymously()
              .catch(() => {
                setCloudStatus('auth-error');
              });
            const unsub = auth.onAuthStateChanged((u) => setFbUser(u));
            return () => unsub();
          }, []);

          useEffect(() => {
            if (!fbUser || !db) return;
            const ref = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('club_state').doc('main');
            const unsub = ref.onSnapshot(
              (snap) => {
                setCloudStatus('connected');
                if (snap.exists) {
                  applyPayload(snap.data());
                } else {
                  syncClubStateToCloud();
                }
              },
              () => {
                setCloudStatus('rule-error');
                db = null;
              }
            );
            return () => unsub();
          }, [fbUser]);

          const syncClubStateToCloud = async (overrides = {}) => {
            const payload = {
              adminPin: overrides.adminPin !== undefined ? overrides.adminPin : adminPin,
              clubLogo: overrides.clubLogo !== undefined ? overrides.clubLogo : clubLogo,
              duesAccount: overrides.duesAccount !== undefined ? overrides.duesAccount : duesAccount,
              regularAccount: overrides.regularAccount !== undefined ? overrides.regularAccount : regularAccount,
              presidentPhone: overrides.presidentPhone !== undefined ? overrides.presidentPhone : presidentPhone,
              vicePresidentPhone:
                overrides.vicePresidentPhone !== undefined ? overrides.vicePresidentPhone : vicePresidentPhone,
              currentSemesterName:
                overrides.currentSemesterName !== undefined ? overrides.currentSemesterName : currentSemesterName,
              archivedSemesters:
                overrides.archivedSemesters !== undefined ? overrides.archivedSemesters : archivedSemesters,
              members: overrides.members !== undefined ? overrides.members : members,
              sessions: overrides.sessions !== undefined ? overrides.sessions : sessions,
              shoeRentalFee: overrides.shoeRentalFee !== undefined ? overrides.shoeRentalFee : shoeRentalFee,
              updatedAt: Date.now(),
            };
            try {
              localStorage.setItem(LOCAL_CLUB_STORAGE_KEY, JSON.stringify(payload));
            } catch (err) {}
            if (!fbUser || !db) return;
            try {
              await db
                .collection('artifacts')
                .doc(appId)
                .collection('public')
                .doc('data')
                .collection('club_state')
                .doc('main')
                .set(payload);
            } catch (err) {}
          };

          const isArchivedSemester = selectedSemesterId !== 'current';
          const activeArchivedSemester = useMemo(
            () => archivedSemesters.find((s) => s.id === selectedSemesterId) || null,
            [archivedSemesters, selectedSemesterId]
          );
          const isAdmin = role === 'admin' && !isArchivedSemester;

          useEffect(() => {
            if (role === 'member' && ['scores', 'teams', 'members'].includes(activeTab)) {
              setActiveTab('leaderboard');
            }
          }, [role, activeTab]);

          const effectiveMembers = useMemo(
            () => (isArchivedSemester && activeArchivedSemester ? activeArchivedSemester.membersSnapshot : members),
            [isArchivedSemester, activeArchivedSemester, members]
          );

          const effectiveSessions = useMemo(
            () => (isArchivedSemester && activeArchivedSemester ? activeArchivedSemester.sessions : sessions),
            [isArchivedSemester, activeArchivedSemester, sessions]
          );

          const sortedSessions = useMemo(
            () => [...effectiveSessions].sort((a, b) => a.date.localeCompare(b.date)),
            [effectiveSessions]
          );

          const currentSession = useMemo(
            () =>
              effectiveSessions.find((s) => s.id === activeSessionId) ||
              sortedSessions[sortedSessions.length - 1],
            [effectiveSessions, activeSessionId, sortedSessions]
          );

          useEffect(() => {
            if (sortedSessions.length > 0) {
              const exists = sortedSessions.some((s) => s.id === activeSessionId);
              if (!exists) setActiveSessionId(sortedSessions[sortedSessions.length - 1].id);
            }
          }, [selectedSemesterId, sortedSessions, activeSessionId]);

          // 회차별 통계 (0점 미입력 칸 제외한 실제 유효 게임 기준)
          const sessionStats = useMemo(() => {
            if (!currentSession) return [];
            return currentSession.records
              .map((rec) => {
                const member = effectiveMembers.find((m) => m.id === rec.memberId);
                if (!member) return null;
                const playedScores = rec.scores.map((v) => Number(v) || 0).filter((v) => v > 0);
                const gameCount = playedScores.length;
                const rawTotal = playedScores.reduce((acc, v) => acc + v, 0);
                const rawAvg = gameCount > 0 ? rawTotal / gameCount : 0;
                const totalHandicap = member.handicap * gameCount;
                const finalTotal = rawTotal + totalHandicap;
                const finalAvg = gameCount > 0 ? finalTotal / gameCount : 0;
                const highGame = gameCount > 0 ? Math.max(...playedScores) : 0;
                const avgDiff = gameCount > 0 ? Number((finalAvg - member.baseAvg).toFixed(1)) : 0;
                return {
                  ...member,
                  ...rec,
                  gameCount,
                  rawTotal,
                  rawAvg: Number(rawAvg.toFixed(1)),
                  totalHandicap,
                  finalTotal,
                  finalAvg: Number(finalAvg.toFixed(1)),
                  highGame,
                  avgDiff,
                };
              })
              .filter(Boolean);
          }, [currentSession, effectiveMembers]);

          // 학기 통산 통계 + 스마트 상·하향 판정 (0점 제외 유효 게임 기준)
          const allTimeStats = useMemo(() => {
            const map = new Map();
            sortedSessions.forEach((session) => {
              session.records.forEach((rec) => {
                const member = effectiveMembers.find((m) => m.id === rec.memberId);
                if (!member) return;
                if (!map.has(member.id)) {
                  map.set(member.id, {
                    ...member,
                    sessionCount: 0,
                    totalGames: 0,
                    rawTotal: 0,
                    totalHandicap: 0,
                    finalTotal: 0,
                    highGame: 0,
                    recentRawScores: [],
                    sessionHistory: [],
                  });
                }
                const entry = map.get(member.id);
                const playedScores = rec.scores.map((v) => Number(v) || 0).filter((v) => v > 0);
                const gCount = playedScores.length;
                const sRaw = playedScores.reduce((acc, v) => acc + v, 0);
                const sHandi = member.handicap * gCount;
                const sFinal = sRaw + sHandi;
                const sHigh = gCount > 0 ? Math.max(...playedScores) : 0;

                if (gCount > 0) {
                  entry.sessionCount += 1;
                  entry.totalGames += gCount;
                  entry.rawTotal += sRaw;
                  entry.totalHandicap += sHandi;
                  entry.finalTotal += sFinal;
                  entry.recentRawScores.push(...playedScores);
                  if (sHigh > entry.highGame) entry.highGame = sHigh;
                }

                entry.sessionHistory.push({
                  sessionId: session.id,
                  date: session.date,
                  title: session.title,
                  scores: rec.scores,
                  gameCount: gCount,
                  finalAvg: gCount > 0 ? Number((sFinal / gCount).toFixed(1)) : 0,
                });
              });
            });

            return Array.from(map.values())
              .map((item) => {
                const rawAvg = item.totalGames > 0 ? Number((item.rawTotal / item.totalGames).toFixed(1)) : 0;
                const finalAvg = item.totalGames > 0 ? Number((item.finalTotal / item.totalGames).toFixed(1)) : 0;
                const avgDiff = item.totalGames > 0 ? Number((finalAvg - item.baseAvg).toFixed(1)) : 0;
                const rawDiff = item.totalGames > 0 ? Number((rawAvg - item.baseAvg).toFixed(1)) : 0;

                const last4 = item.recentRawScores.slice(-4);
                const recent4RawAvg =
                  last4.length > 0 ? Number((last4.reduce((a, b) => a + b, 0) / last4.length).toFixed(1)) : rawAvg;
                const recent4Diff = Number((recent4RawAvg - item.baseAvg).toFixed(1));

                const adjustedAtGames = Number(item.avgAdjustedAtGames) || 0;
                const gamesSinceLastAdjust = item.totalGames - adjustedAtGames;
                const hasCooldownPassed = adjustedAtGames === 0 || gamesSinceLastAdjust >= 4;

                const recommendUpgrade =
                  !item.isGuest &&
                  item.status !== 'dormant' &&
                  item.totalGames >= 4 &&
                  hasCooldownPassed &&
                  rawDiff >= 12 &&
                  recent4Diff >= 10;

                const recommendDowngrade =
                  !item.isGuest &&
                  item.status !== 'dormant' &&
                  item.totalGames >= 6 &&
                  hasCooldownPassed &&
                  rawDiff <= -15 &&
                  recent4Diff <= -12;

                const recommendedNewAvg = Math.max(
                  90,
                  Math.min(250, Math.round(item.baseAvg + rawDiff * 0.7))
                );

                return {
                  ...item,
                  rawAvg,
                  finalAvg,
                  avgDiff,
                  rawDiff,
                  recent4RawAvg,
                  recommendUpgrade,
                  recommendDowngrade,
                  recommendedNewAvg,
                };
              })
              .sort((a, b) => {
                if (sortBy === 'avg') return b.finalAvg - a.finalAvg || b.finalTotal - a.finalTotal;
                if (sortBy === 'total') return b.finalTotal - a.finalTotal || b.finalAvg - a.finalAvg;
                if (sortBy === 'high') return b.highGame - a.highGame || b.finalAvg - a.finalAvg;
                if (sortBy === 'games') return b.totalGames - a.totalGames || b.finalAvg - a.finalAvg;
                return b.finalAvg - a.finalAvg;
              });
          }, [sortedSessions, effectiveMembers, sortBy]);

          const sessionAvgRanked = useMemo(() => {
            const statMap = new Map(allTimeStats.map((s) => [s.id, s]));
            return [...sessionStats]
              .map((p) => {
                const overall = statMap.get(p.id);
                return {
                  ...p,
                  recommendUpgrade: Boolean(overall?.recommendUpgrade),
                  recommendDowngrade: Boolean(overall?.recommendDowngrade),
                  recommendedNewAvg: overall?.recommendedNewAvg || p.baseAvg,
                };
              })
              .sort((a, b) => {
                if (b.finalAvg !== a.finalAvg) return b.finalAvg - a.finalAvg;
                if (b.finalTotal !== a.finalTotal) return b.finalTotal - a.finalTotal;
                return b.highGame - a.highGame;
              });
          }, [sessionStats, allTimeStats]);

          const sessionTop10 = useMemo(() => sessionAvgRanked.slice(0, 10), [sessionAvgRanked]);

          const avgUpgradeCandidates = useMemo(
            () => allTimeStats.filter((st) => st.recommendUpgrade),
            [allTimeStats]
          );

          const avgDowngradeCandidates = useMemo(
            () => allTimeStats.filter((st) => st.recommendDowngrade),
            [allTimeStats]
          );

          const handlePinSubmit = (e) => {
            e.preventDefault();
            if (pinInput === adminPin) {
              setRole('admin');
              setShowPinModal(false);
              setPinInput('');
              setPinError('');
              showToast('임원진 모드로 전환되었습니다.');
            } else {
              setPinError('비밀번호가 일치하지 않습니다.');
            }
          };

          const handleLogoUpload = (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              const img = new Image();
              img.onload = () => {
                const size = 160;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                const minSide = Math.min(img.width, img.height);
                const sx = (img.width - minSide) / 2;
                const sy = (img.height - minSide) / 2;
                ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
                const dataUrl = canvas.toDataURL('image/png', 0.9);
                setClubLogo(dataUrl);
                syncClubStateToCloud({ clubLogo: dataUrl });
                showToast('클럽 로고가 업데이트되었습니다.');
              };
              img.src = reader.result;
            };
            reader.readAsDataURL(file);
          };

          const handleChangeAdminPin = (e) => {
            e.preventDefault();
            if (currentPinInput !== adminPin) {
              setPinChangeError('현재 비밀번호가 일치하지 않습니다.');
              return;
            }
            if (!/^\d{4,8}$/.test(newPinInput)) {
              setPinChangeError('새 비밀번호는 4~8자리 숫자로 입력해주세요.');
              return;
            }
            if (newPinInput !== confirmPinInput) {
              setPinChangeError('새 비밀번호 확인이 일치하지 않습니다.');
              return;
            }
            setAdminPin(newPinInput);
            syncClubStateToCloud({ adminPin: newPinInput });
            setCurrentPinInput('');
            setNewPinInput('');
            setConfirmPinInput('');
            setPinChangeError('');
            showToast('임원진 비밀번호가 변경되었습니다.');
          };

          const handleSaveExternalFbConfig = () => {
            const raw = externalFbInput.trim();
            if (!raw) {
              try {
                localStorage.removeItem(EXTERNAL_FB_STORAGE_KEY);
              } catch (e) {}
              showToast('클라우드 설정이 초기화되었습니다. 새로고침 후 적용됩니다.');
              return;
            }
            try {
              const match = raw.match(/\{[\s\S]*\}/);
              const objStr = match ? match[0] : raw;
              const normalized = objStr.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":');
              const parsed = JSON.parse(normalized);
              if (!parsed || !parsed.apiKey) {
                showToast('올바른 Firebase 설정 코드(apiKey 포함)를 붙여넣어 주세요.');
                return;
              }
              localStorage.setItem(EXTERNAL_FB_STORAGE_KEY, JSON.stringify(parsed));
              showToast('클라우드 설정이 저장되었습니다! 새로고침하면 실시간 동기화됩니다.');
            } catch (err) {
              showToast('설정 코드 형식을 인식할 수 없습니다. 중괄호 { ... } 부분을 복사해주세요.');
            }
          };

          const handleApplyRecommendedAvg = (memberId, newAvg, directionLabel) => {
            if (!isAdmin) return;
            const targetStat = allTimeStats.find((s) => s.id === memberId);
            const currentGames = targetStat ? targetStat.totalGames : 0;
            const autoHandi = Math.max(0, Math.round((200 - newAvg) * 0.8));
            const nextMembers = members.map((m) =>
              m.id === memberId
                ? { ...m, baseAvg: newAvg, handicap: autoHandi, avgAdjustedAtGames: currentGames }
                : m
            );
            setMembers(nextMembers);
            syncClubStateToCloud({ members: nextMembers });
            showToast(`기준 에버 ${newAvg}점(핸디 +${autoHandi})으로 ${directionLabel} 조정되었습니다.`);
          };

          const handleAddMember = (e) => {
            e.preventDefault();
            if (!isAdmin || !newMemberName.trim()) return;
            const id = `m_${Date.now()}`;
            const created = {
              id,
              name: newMemberIsGuest ? `${newMemberName.trim()}(게스트)` : newMemberName.trim(),
              baseAvg: Number(newMemberAvg) || 150,
              handicap: Number(newMemberHandicap) || 0,
              isGuest: newMemberIsGuest,
              status: 'active',
            };
            const nextMembers = [...members, created];
            const nextSessions = sessions.map((sess) =>
              sess.id === currentSession.id
                ? {
                    ...sess,
                    records: [...sess.records, { memberId: id, scores: [0, 0], shoeRental: false }],
                  }
                : sess
            );
            setMembers(nextMembers);
            setSessions(nextSessions);
            syncClubStateToCloud({ members: nextMembers, sessions: nextSessions });
            setNewMemberName('');
            setNewMemberAvg(150);
            setNewMemberHandicap(30);
            setNewMemberIsGuest(false);
            setShowAddMember(false);
            showToast(`${created.name} 회원이 등록되었습니다.`);
          };

          const handleToggleDormantMember = (memberId) => {
            if (!isAdmin) return;
            const target = members.find((m) => m.id === memberId);
            if (!target) return;
            const nextStatus = target.status === 'dormant' ? 'active' : 'dormant';
            const nextMembers = members.map((m) =>
              m.id === memberId ? { ...m, status: nextStatus } : m
            );
            setMembers(nextMembers);
            if (nextStatus === 'dormant') {
              const nextSessions = sessions.map((sess) => {
                if (sess.id !== currentSession.id) return sess;
                const cleanedLanes = { ...createEmptyLanes(), ...(sess.lanes || {}) };
                for (let i = 1; i <= TOTAL_LANES; i += 1) {
                  cleanedLanes[i] = (cleanedLanes[i] || [null, null, null, null]).map((id) =>
                    id === memberId ? null : id
                  );
                }
                return {
                  ...sess,
                  lanes: cleanedLanes,
                  records: sess.records.filter((r) => r.memberId !== memberId),
                };
              });
              setSessions(nextSessions);
              syncClubStateToCloud({ members: nextMembers, sessions: nextSessions });
              showToast(`${target.name} 회원이 휴면 전환되었습니다.`);
            } else {
              syncClubStateToCloud({ members: nextMembers });
              showToast(`${target.name} 회원이 활동중으로 복귀했습니다.`);
            }
          };

          const handleConfirmDeleteMember = () => {
            if (!isAdmin || !deleteTargetMember) return;
            const targetId = deleteTargetMember.id;
            const targetName = deleteTargetMember.name;
            const nextMembers = members.filter((m) => m.id !== targetId);
            const nextSessions = sessions.map((sess) => {
              const cleanedLanes = { ...createEmptyLanes(), ...(sess.lanes || {}) };
              for (let i = 1; i <= TOTAL_LANES; i += 1) {
                cleanedLanes[i] = (cleanedLanes[i] || [null, null, null, null]).map((id) =>
                  id === targetId ? null : id
                );
              }
              return {
                ...sess,
                lanes: cleanedLanes,
                records: sess.records.filter((r) => r.memberId !== targetId),
              };
            });
            setMembers(nextMembers);
            setSessions(nextSessions);
            syncClubStateToCloud({ members: nextMembers, sessions: nextSessions });
            setDeleteTargetMember(null);
            showToast(`${targetName} 회원이 영구 삭제되었습니다.`);
          };

          const updateMemberField = (memberId, field, value) => {
            if (!isAdmin) return;
            const nextMembers = members.map((m) => (m.id === memberId ? { ...m, [field]: value } : m));
            setMembers(nextMembers);
            syncClubStateToCloud({ members: nextMembers });
          };

          const handleConfirmDeleteSemester = () => {
            if (role !== 'admin' || !deleteTargetSemester) return;
            const targetId = deleteTargetSemester.id;
            const targetName = deleteTargetSemester.name;
            const nextArchived = archivedSemesters.filter((sem) => sem.id !== targetId);
            setArchivedSemesters(nextArchived);
            if (selectedSemesterId === targetId) setSelectedSemesterId('current');
            syncClubStateToCloud({ archivedSemesters: nextArchived });
            setDeleteTargetSemester(null);
            showToast(`보관된 '${targetName}' 기록이 영구 삭제되었습니다.`);
          };

          const openEditSessionModal = () => {
            if (!isAdmin || !currentSession) return;
            setEditSessionDate(currentSession.date || '');
            setEditSessionTitle(currentSession.title || '');
            setShowEditSessionModal(true);
          };

          const handleUpdateSessionInfo = (e) => {
            e.preventDefault();
            if (!isAdmin || !currentSession || !editSessionDate || !editSessionTitle.trim()) return;
            updateCurrentSession((sess) => ({
              ...sess,
              date: editSessionDate,
              title: editSessionTitle.trim(),
            }));
            setShowEditSessionModal(false);
            showToast('정기전 회차 정보가 수정되었습니다.');
          };

          const updateCurrentSession = (updater) => {
            if (!isAdmin) return;
            const nextSessions = sessions.map((sess) =>
              sess.id === currentSession.id ? updater(sess) : sess
            );
            setSessions(nextSessions);
            syncClubStateToCloud({ sessions: nextSessions });
          };

          const handleCreateSession = (e) => {
            e.preventDefault();
            if (!isAdmin || !newSessionDate || !newSessionTitle.trim()) return;
            const activeMembers = members.filter((m) => m.status !== 'dormant');
            const newId = `s-${Date.now()}`;
            const created = {
              id: newId,
              date: newSessionDate,
              title: newSessionTitle.trim(),
              gameFee: Number(newSessionGameFee) || 4500,
              sidePotFee: Number(newSessionSidePot) || 0,
              extraFund: 0,
              lanes: createEmptyLanes(),
              records: activeMembers.map((m) => ({
                memberId: m.id,
                scores: [0, 0],
                shoeRental: false,
              })),
            };
            const nextSessions = [...sessions, created];
            setSessions(nextSessions);
            setActiveSessionId(newId);
            syncClubStateToCloud({ sessions: nextSessions });
            setShowNewSessionModal(false);
            setActiveTab('scores');
            showToast(`${newSessionTitle.trim()} 회차가 추가되었습니다.`);
          };

          const handleConfirmDeleteSession = () => {
            if (!isAdmin || !deleteTargetSession) return;
            if (sessions.length <= 1) {
              showToast('최소 1개의 정기전 회차는 유지되어야 합니다.');
              setDeleteTargetSession(null);
              return;
            }
            const targetId = deleteTargetSession.id;
            const targetTitle = deleteTargetSession.title;
            const remaining = sessions.filter((s) => s.id !== targetId);
            const sortedRemaining = [...remaining].sort((a, b) => a.date.localeCompare(b.date));
            setSessions(remaining);
            if (activeSessionId === targetId && sortedRemaining.length > 0) {
              setActiveSessionId(sortedRemaining[sortedRemaining.length - 1].id);
            }
            syncClubStateToCloud({ sessions: remaining });
            setDeleteTargetSession(null);
            showToast(`'${targetTitle}' 기록이 삭제되었습니다.`);
          };

          const handleResetSemester = (e) => {
            e.preventDefault();
            if (!isAdmin || !nextSemesterName.trim()) return;
            const trimmedNextName = nextSemesterName.trim();
            const archivedItem = {
              id: `sem-${Date.now()}`,
              name: currentSemesterName,
              archivedAt: new Date().toISOString().slice(0, 10),
              membersSnapshot: members.map((m) => ({ ...m })),
              sessions: sessions.map((s) => ({
                ...s,
                records: s.records.map((r) => ({ ...r, scores: [...r.scores] })),
              })),
            };
            const nextArchivedList = [archivedItem, ...archivedSemesters];
            setArchivedSemesters(nextArchivedList);

            let updatedMembers = members;
            if (updateBaseAvgFromSemester && allTimeStats.length > 0) {
              const avgMap = new Map(allTimeStats.map((st) => [st.id, Math.round(st.finalAvg)]));
              updatedMembers = members.map((m) => {
                if (avgMap.has(m.id)) {
                  const newAvg = avgMap.get(m.id);
                  const autoHandi = Math.max(0, Math.round((200 - newAvg) * 0.8));
                  return { ...m, baseAvg: newAvg, handicap: autoHandi, avgAdjustedAtGames: 0 };
                }
                return { ...m, avgAdjustedAtGames: 0 };
              });
              setMembers(updatedMembers);
            }

            const activeList = updatedMembers.filter((m) => m.status !== 'dormant');
            const freshSessionId = `s-${Date.now()}`;
            const freshSession = {
              id: freshSessionId,
              date: nextFirstDate || new Date().toISOString().slice(0, 10),
              title: nextFirstTitle.trim() || `${trimmedNextName} 제1회 정기전`,
              gameFee: currentSession?.gameFee ?? 4500,
              sidePotFee: currentSession?.sidePotFee ?? 2000,
              extraFund: 0,
              lanes: createEmptyLanes(),
              records: activeList.map((m) => ({
                memberId: m.id,
                scores: [0, 0],
                shoeRental: false,
              })),
            };

            setCurrentSemesterName(trimmedNextName);
            setSessions([freshSession]);
            setActiveSessionId(freshSessionId);
            setSelectedSemesterId('current');
            setTeams([]);
            syncClubStateToCloud({
              currentSemesterName: trimmedNextName,
              archivedSemesters: nextArchivedList,
              members: updatedMembers,
              sessions: [freshSession],
            });
            setShowResetSemesterModal(false);
            showToast(`'${archivedItem.name}' 기록이 보관되고 '${trimmedNextName}'가 시작되었습니다.`);
          };

          const handleScoreChange = (memberId, gameIdx, value) => {
            if (!isAdmin) return;
            const numeric = value === '' ? 0 : Math.min(300, Math.max(0, Number(value)));
            updateCurrentSession((sess) => ({
              ...sess,
              records: sess.records.map((rec) => {
                if (rec.memberId !== memberId) return rec;
                const nextScores = [...rec.scores];
                nextScores[gameIdx] = numeric;
                return { ...rec, scores: nextScores };
              }),
            }));
          };

          const handleAddGame = (memberId) => {
            if (!isAdmin) return;
            updateCurrentSession((sess) => ({
              ...sess,
              records: sess.records.map((rec) =>
                rec.memberId === memberId ? { ...rec, scores: [...rec.scores, 0] } : rec
              ),
            }));
          };

          const handleRemoveGame = (memberId, gameIdx) => {
            if (!isAdmin) return;
            updateCurrentSession((sess) => ({
              ...sess,
              records: sess.records.map((rec) => {
                if (rec.memberId !== memberId || rec.scores.length <= 1) return rec;
                return { ...rec, scores: rec.scores.filter((_, idx) => idx !== gameIdx) };
              }),
            }));
          };

          const toggleMemberInSession = (memberId) => {
            if (!isAdmin) return;
            const exists = currentSession.records.some((r) => r.memberId === memberId);
            if (exists) {
              updateCurrentSession((sess) => {
                const cleanedLanes = { ...createEmptyLanes(), ...(sess.lanes || {}) };
                for (let i = 1; i <= TOTAL_LANES; i += 1) {
                  cleanedLanes[i] = (cleanedLanes[i] || [null, null, null, null]).map((id) =>
                    id === memberId ? null : id
                  );
                }
                return {
                  ...sess,
                  lanes: cleanedLanes,
                  records: sess.records.filter((r) => r.memberId !== memberId),
                };
              });
            } else {
              updateCurrentSession((sess) => ({
                ...sess,
                records: [...sess.records, { memberId, scores: [0, 0], shoeRental: false }],
              }));
            }
          };

          const toggleShoeRental = (memberId) => {
            if (!isAdmin) return;
            updateCurrentSession((sess) => ({
              ...sess,
              records: sess.records.map((r) =>
                r.memberId === memberId ? { ...r, shoeRental: !r.shoeRental } : r
              ),
            }));
          };

          // 레인 데이터 및 자동 배정
          const currentLanes = useMemo(() => {
            const base = createEmptyLanes();
            if (!currentSession?.lanes) return base;
            for (let i = 1; i <= TOTAL_LANES; i += 1) {
              if (Array.isArray(currentSession.lanes[i])) {
                base[i] = [
                  currentSession.lanes[i][0] || null,
                  currentSession.lanes[i][1] || null,
                  currentSession.lanes[i][2] || null,
                  currentSession.lanes[i][3] || null,
                ];
              }
            }
            return base;
          }, [currentSession]);

          const assignedMemberIds = useMemo(() => {
            const set = new Set();
            Object.values(currentLanes).forEach((slots) =>
              slots.forEach((id) => {
                if (id) set.add(id);
              })
            );
            return set;
          }, [currentLanes]);

          const unassignedActiveMembers = useMemo(
            () => effectiveMembers.filter((m) => m.status !== 'dormant' && !assignedMemberIds.has(m.id)),
            [effectiveMembers, assignedMemberIds]
          );

          const laneSummaries = useMemo(() => {
            const list = [];
            for (let laneNum = 1; laneNum <= TOTAL_LANES; laneNum += 1) {
              const slotMembers = currentLanes[laneNum].map((memberId) => {
                if (!memberId) return null;
                const member = effectiveMembers.find((m) => m.id === memberId);
                return member ? { ...member, displayAvg: member.baseAvg } : null;
              });
              const filled = slotMembers.filter(Boolean);
              const laneTotalAvg = filled.reduce((sum, m) => sum + (m.displayAvg || 0), 0);
              const laneMeanAvg = filled.length > 0 ? Number((laneTotalAvg / filled.length).toFixed(1)) : 0;
              list.push({ laneNum, slots: slotMembers, assignedCount: filled.length, laneMeanAvg });
            }
            return list;
          }, [currentLanes, effectiveMembers]);

          const activeLaneCount = useMemo(
            () => laneSummaries.filter((l) => l.assignedCount > 0).length,
            [laneSummaries]
          );

          const handleClearAllLanes = () => {
            if (!isAdmin) return;
            updateCurrentSession((sess) => ({
              ...sess,
              lanes: createEmptyLanes(),
            }));
            showToast('모든 레인 배정이 초기화되었습니다.');
          };

          const handleAutoAssignLanes = () => {
            if (!isAdmin) return;
            const startIdx = Math.max(1, Math.min(TOTAL_LANES, Number(startLaneNum) || 1));
            const maxAvailableLanes = TOTAL_LANES - startIdx + 1;
            const laneCountToUse = Math.max(1, Math.min(maxAvailableLanes, Number(targetLaneCount) || 1));
            const endIdx = startIdx + laneCountToUse - 1;

            const nextLanes = createEmptyLanes();
            const alreadyAssignedSet = new Set();
            for (let l = 1; l <= TOTAL_LANES; l += 1) {
              nextLanes[l] = [...(currentLanes[l] || [null, null, null, null])];
              nextLanes[l].forEach((id) => {
                if (id) alreadyAssignedSet.add(id);
              });
            }

            const remainingMembers = effectiveMembers.filter(
              (m) => m.status !== 'dormant' && !alreadyAssignedSet.has(m.id)
            );
            if (remainingMembers.length === 0) {
              showToast('이미 모든 활동 회원이 레인에 배정되어 있습니다.');
              return;
            }

            const emptySlots = [];
            for (let sIdx = 0; sIdx < SLOTS_PER_LANE; sIdx += 1) {
              for (let l = startIdx; l <= endIdx; l += 1) {
                if (!nextLanes[l][sIdx]) {
                  emptySlots.push({ laneNum: l, slotIdx: sIdx });
                }
              }
            }

            if (emptySlots.length === 0) {
              showToast(`${startIdx}~${endIdx}레인에 남은 빈 자리가 없습니다. 레인 수를 늘려주세요.`);
              return;
            }

            const fillCapacity = Math.min(remainingMembers.length, emptySlots.length);

            if (laneAssignMode === 'teams' && teams.length > 0) {
              const orderedUnassigned = [];
              const seen = new Set();
              teams.forEach((team) => {
                team.forEach((tm) => {
                  if (!alreadyAssignedSet.has(tm.id) && !seen.has(tm.id)) {
                    const found = remainingMembers.find((rm) => rm.id === tm.id);
                    if (found) {
                      orderedUnassigned.push(found);
                      seen.add(tm.id);
                    }
                  }
                });
              });
              remainingMembers.forEach((rm) => {
                if (!seen.has(rm.id)) orderedUnassigned.push(rm);
              });

              const laneFirstSlots = [];
              for (let l = startIdx; l <= endIdx; l += 1) {
                for (let sIdx = 0; sIdx < SLOTS_PER_LANE; sIdx += 1) {
                  if (!nextLanes[l][sIdx]) {
                    laneFirstSlots.push({ laneNum: l, slotIdx: sIdx });
                  }
                }
              }
              orderedUnassigned.slice(0, laneFirstSlots.length).forEach((member, idx) => {
                const target = laneFirstSlots[idx];
                nextLanes[target.laneNum][target.slotIdx] = member.id;
              });
            } else if (laneAssignMode === 'random') {
              const shuffled = [...remainingMembers].sort(() => Math.random() - 0.5);
              shuffled.slice(0, fillCapacity).forEach((member, idx) => {
                const target = emptySlots[idx];
                nextLanes[target.laneNum][target.slotIdx] = member.id;
              });
            } else {
              const sorted = [...remainingMembers].sort((a, b) => b.baseAvg - a.baseAvg);
              const targetLanes = [];
              for (let l = startIdx; l <= endIdx; l += 1) targetLanes.push(l);

              const laneAvgMap = new Map(
                targetLanes.map((l) => {
                  const sum = nextLanes[l].reduce((acc, id) => {
                    if (!id) return acc;
                    const found = effectiveMembers.find((m) => m.id === id);
                    return acc + (found ? found.baseAvg : 0);
                  }, 0);
                  return [l, sum];
                })
              );

              sorted.slice(0, fillCapacity).forEach((member) => {
                const candidateLanes = targetLanes.filter((l) =>
                  nextLanes[l].some((id) => id === null)
                );
                if (candidateLanes.length === 0) return;

                candidateLanes.sort((a, b) => {
                  const countA = nextLanes[a].filter(Boolean).length;
                  const countB = nextLanes[b].filter(Boolean).length;
                  if (countA !== countB) return countA - countB;
                  return (laneAvgMap.get(a) || 0) - (laneAvgMap.get(b) || 0);
                });

                const chosenLane = candidateLanes[0];
                const openSlotIdx = nextLanes[chosenLane].findIndex((id) => id === null);
                if (openSlotIdx !== -1) {
                  nextLanes[chosenLane][openSlotIdx] = member.id;
                  laneAvgMap.set(chosenLane, (laneAvgMap.get(chosenLane) || 0) + member.baseAvg);
                }
              });
            }

            updateCurrentSession((sess) => ({ ...sess, lanes: nextLanes }));
            showToast(
              `기존 배정 인원을 유지하고 ${startIdx}~${endIdx}레인 빈칸에 ${fillCapacity}명을 자동 배정했습니다.`
            );
          };

          const handleAssignMemberToLaneSlot = (laneNum, slotIdx, memberId) => {
            if (!isAdmin) return;
            updateCurrentSession((sess) => {
              const nextLanes = { ...createEmptyLanes(), ...(sess.lanes || {}) };
              for (let i = 1; i <= TOTAL_LANES; i += 1) {
                nextLanes[i] = [...(nextLanes[i] || [null, null, null, null])].map((id) =>
                  id === memberId ? null : id
                );
              }
              nextLanes[laneNum][slotIdx] = memberId;
              return { ...sess, lanes: nextLanes };
            });
            setAssignModalTarget(null);
          };

          const handleRemoveMemberFromLaneSlot = (laneNum, slotIdx) => {
            if (!isAdmin) return;
            updateCurrentSession((sess) => {
              const nextLanes = { ...createEmptyLanes(), ...(sess.lanes || {}) };
              const row = [...(nextLanes[laneNum] || [null, null, null, null])];
              row[slotIdx] = null;
              nextLanes[laneNum] = row;
              return { ...sess, lanes: nextLanes };
            });
          };

          // 레인 배정표 PNG 생성 (하단에 정기전 계좌 및 회장 연락처 포함)
          const handleGenerateLaneImage = () => {
            const targetLanes =
              laneFilter === 'all' ? laneSummaries : laneSummaries.filter((l) => l.assignedCount > 0);
            const displayLanes = targetLanes.length > 0 ? targetLanes : laneSummaries.slice(0, 4);

            const scale = 2;
            const cols = 2;
            const rows = Math.ceil(displayLanes.length / cols);
            const canvasWidth = 920;
            const headerHeight = 136;
            const cardWidth = 420;
            const cardHeight = 224;
            const gapX = 24;
            const gapY = 20;
            const paddingX = 28;
            const hasContactFooter = Boolean(regularAccount.trim() || presidentPhone.trim());
            const footerHeight = hasContactFooter ? 92 : 52;
            const canvasHeight = headerHeight + rows * cardHeight + Math.max(0, rows - 1) * gapY + footerHeight;

            const canvas = document.createElement('canvas');
            canvas.width = canvasWidth * scale;
            canvas.height = canvasHeight * scale;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.scale(scale, scale);

            const drawRoundRect = (x, y, w, h, r) => {
              ctx.beginPath();
              ctx.moveTo(x + r, y);
              ctx.lineTo(x + w - r, y);
              ctx.quadraticCurveTo(x + w, y, x + w, y + r);
              ctx.lineTo(x + w, y + h - r);
              ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
              ctx.lineTo(x + r, y + h);
              ctx.quadraticCurveTo(x, y + h, x, y + h - r);
              ctx.lineTo(x, y + r);
              ctx.quadraticCurveTo(x, y, x + r, y);
              ctx.closePath();
            };

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            const headerGrad = ctx.createLinearGradient(paddingX, 18, canvasWidth - paddingX, 118);
            headerGrad.addColorStop(0, '#1D4ED8');
            headerGrad.addColorStop(1, '#312E81');
            drawRoundRect(paddingX, 18, canvasWidth - paddingX * 2, 100, 18);
            ctx.fillStyle = headerGrad;
            ctx.fill();

            ctx.fillStyle = '#BFDBFE';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('KOBO · LANE ASSIGNMENT', paddingX + 22, 46);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 24px sans-serif';
            ctx.fillText(`${currentSession.title} 레인 배정표`, paddingX + 22, 76);

            ctx.fillStyle = '#DBEAFE';
            ctx.font = '14px sans-serif';
            ctx.fillText(
              `일시: ${currentSession.date}   |   사용 레인: ${activeLaneCount} / ${TOTAL_LANES}레인   |   배정 인원: ${assignedMemberIds.size}명`,
              paddingX + 22,
              102
            );

            displayLanes.forEach((lane, idx) => {
              const col = idx % cols;
              const row = Math.floor(idx / cols);
              const x = paddingX + col * (cardWidth + gapX);
              const y = headerHeight + row * (cardHeight + gapY);

              drawRoundRect(x, y, cardWidth, cardHeight, 16);
              ctx.fillStyle = lane.assignedCount > 0 ? '#FFFFFF' : '#F8FAFC';
              ctx.fill();
              ctx.lineWidth = 1.5;
              ctx.strokeStyle = lane.assignedCount > 0 ? '#CBD5E1' : '#E2E8F0';
              ctx.stroke();

              ctx.fillStyle = lane.assignedCount > 0 ? '#EFF6FF' : '#F1F5F9';
              drawRoundRect(x + 1, y + 1, cardWidth - 2, 42, 15);
              ctx.fill();

              drawRoundRect(x + 14, y + 8, 66, 26, 8);
              ctx.fillStyle = lane.assignedCount > 0 ? '#2563EB' : '#94A3B8';
              ctx.fill();

              ctx.fillStyle = '#FFFFFF';
              ctx.font = 'bold 13px sans-serif';
              ctx.fillText(`${lane.laneNum}레인`, x + 28, y + 26);

              ctx.fillStyle = '#475569';
              ctx.font = 'bold 12px sans-serif';
              ctx.fillText(
                lane.assignedCount > 0 ? `${lane.assignedCount}/4명 · 평균 에버 ${lane.laneMeanAvg}` : '미배정 공석',
                x + 90,
                y + 26
              );

              lane.slots.forEach((member, sIdx) => {
                const slotY = y + 52 + sIdx * 40;
                drawRoundRect(x + 14, slotY, cardWidth - 28, 33, 8);
                ctx.fillStyle = member ? '#F8FAFC' : '#FFFFFF';
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = member ? '#E2E8F0' : '#F1F5F9';
                ctx.stroke();

                ctx.fillStyle = member ? '#2563EB' : '#94A3B8';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(`${sIdx + 1}번`, x + 24, slotY + 21);

                if (member) {
                  ctx.fillStyle = '#0F172A';
                  ctx.font = 'bold 14px sans-serif';
                  ctx.fillText(member.name, x + 58, slotY + 21);

                  ctx.fillStyle = '#2563EB';
                  ctx.font = 'bold 13px sans-serif';
                  const avgText = `에버 ${member.displayAvg}`;
                  const textWidth = ctx.measureText(avgText).width;
                  ctx.fillText(avgText, x + cardWidth - 28 - textWidth, slotY + 21);
                } else {
                  ctx.fillStyle = '#94A3B8';
                  ctx.font = '12px sans-serif';
                  ctx.fillText('빈 자리', x + 58, slotY + 21);
                }
              });
            });

            if (hasContactFooter) {
              const boxY = canvasHeight - footerHeight + 10;
              drawRoundRect(paddingX, boxY, canvasWidth - paddingX * 2, 46, 12);
              ctx.fillStyle = '#EFF6FF';
              ctx.fill();
              ctx.lineWidth = 1;
              ctx.strokeStyle = '#BFDBFE';
              ctx.stroke();

              ctx.fillStyle = '#1E3A8A';
              ctx.font = 'bold 13px sans-serif';
              const parts = [];
              if (regularAccount.trim()) parts.push(`💳 정기전 계좌: ${regularAccount.trim()}`);
              if (presidentPhone.trim()) parts.push(`📞 회장 연락처: ${presidentPhone.trim()}`);
              ctx.fillText(parts.join('     |     '), paddingX + 18, boxY + 28);
            }

            ctx.fillStyle = '#64748B';
            ctx.font = '12px sans-serif';
            ctx.fillText(`Generated by KOBO · ${currentSession.date}`, paddingX, canvasHeight - 14);

            setLanePreviewImage(canvas.toDataURL('image/png'));
          };

          // 정기전 에버리지 TOP 10 캡처 이미지 생성
          const handleGenerateTop10Image = () => {
            if (sessionTop10.length === 0) {
              showToast('캡처할 순위 기록이 없습니다.');
              return;
            }
            const scale = 2;
            const canvasWidth = 760;
            const headerHeight = 128;
            const rowHeight = 52;
            const paddingX = 28;
            const footerHeight = 48;
            const canvasHeight = headerHeight + sessionTop10.length * rowHeight + 24 + footerHeight;

            const canvas = document.createElement('canvas');
            canvas.width = canvasWidth * scale;
            canvas.height = canvasHeight * scale;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.scale(scale, scale);

            const drawRoundRect = (x, y, w, h, r) => {
              ctx.beginPath();
              ctx.moveTo(x + r, y);
              ctx.lineTo(x + w - r, y);
              ctx.quadraticCurveTo(x + w, y, x + w, y + r);
              ctx.lineTo(x + w, y + h - r);
              ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
              ctx.lineTo(x + r, y + h);
              ctx.quadraticCurveTo(x, y + h, x, y + h - r);
              ctx.lineTo(x, y + r);
              ctx.quadraticCurveTo(x, y, x + r, y);
              ctx.closePath();
            };

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            const headerGrad = ctx.createLinearGradient(paddingX, 18, canvasWidth - paddingX, 114);
            headerGrad.addColorStop(0, '#1D4ED8');
            headerGrad.addColorStop(1, '#4338CA');
            drawRoundRect(paddingX, 18, canvasWidth - paddingX * 2, 96, 18);
            ctx.fillStyle = headerGrad;
            ctx.fill();

            ctx.fillStyle = '#FDE68A';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('KOBO · REGULAR MATCH TOP 10', paddingX + 22, 45);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 23px sans-serif';
            ctx.fillText(`${currentSession.title} 에버리지 TOP 10`, paddingX + 22, 74);

            ctx.fillStyle = '#DBEAFE';
            ctx.font = '13px sans-serif';
            ctx.fillText(
              `일시: ${currentSession.date}   |   참석 인원: ${sessionStats.length}명   |   핸디캡 포함 에버 기준`,
              paddingX + 22,
              98
            );

            sessionTop10.forEach((player, idx) => {
              const rank = idx + 1;
              const y = headerHeight + idx * rowHeight;

              drawRoundRect(paddingX, y, canvasWidth - paddingX * 2, 44, 12);
              ctx.fillStyle = rank <= 3 ? '#EFF6FF' : '#F8FAFC';
              ctx.fill();
              ctx.lineWidth = 1;
              ctx.strokeStyle = rank <= 3 ? '#BFDBFE' : '#E2E8F0';
              ctx.stroke();

              drawRoundRect(paddingX + 12, y + 9, 28, 26, 8);
              ctx.fillStyle =
                rank === 1 ? '#F59E0B' : rank === 2 ? '#94A3B8' : rank === 3 ? '#B45309' : '#CBD5E1';
              ctx.fill();

              ctx.fillStyle = rank <= 3 ? '#FFFFFF' : '#334155';
              ctx.font = 'bold 13px sans-serif';
              ctx.fillText(String(rank), paddingX + (rank >= 10 ? 18 : 22), y + 27);

              ctx.fillStyle = '#0F172A';
              ctx.font = 'bold 15px sans-serif';
              ctx.fillText(player.name, paddingX + 52, y + 27);

              ctx.fillStyle = '#64748B';
              ctx.font = '12px sans-serif';
              ctx.fillText(
                `${player.gameCount}G (${player.scores.join(' · ')}) · 하이 ${player.highGame}`,
                paddingX + 195,
                y + 27
              );

              ctx.fillStyle = '#1D4ED8';
              ctx.font = 'bold 16px sans-serif';
              const avgLabel = `에버 ${player.finalAvg}`;
              const w = ctx.measureText(avgLabel).width;
              ctx.fillText(avgLabel, canvasWidth - paddingX - 16 - w, y + 27);
            });

            ctx.fillStyle = '#64748B';
            ctx.font = '12px sans-serif';
            ctx.fillText(`Generated by KOBO · ${currentSession.date}`, paddingX, canvasHeight - 16);

            setTop10PreviewImage(canvas.toDataURL('image/png'));
          };

          // 팀짜기 전용 인원 리스트 (정기전과 독립 추가/제외 지원)
          const effectiveTeamPool = useMemo(() => {
            const baseIds =
              teamParticipantIds !== null
                ? teamParticipantIds
                : sessionStats.filter((m) => m.status !== 'dormant').map((m) => m.id);

            const fromClub = baseIds
              .map((id) => effectiveMembers.find((m) => m.id === id))
              .filter(Boolean);

            return [...fromClub, ...customTeamGuests];
          }, [teamParticipantIds, sessionStats, effectiveMembers, customTeamGuests]);

          const toggleTeamMember = (memberId) => {
            const currentIds =
              teamParticipantIds !== null
                ? teamParticipantIds
                : sessionStats.filter((m) => m.status !== 'dormant').map((m) => m.id);
            if (currentIds.includes(memberId)) {
              setTeamParticipantIds(currentIds.filter((id) => id !== memberId));
            } else {
              setTeamParticipantIds([...currentIds, memberId]);
            }
          };

          const handleAddCustomTeamGuest = (e) => {
            e.preventDefault();
            if (!customGuestName.trim()) return;
            setCustomTeamGuests((prev) => [
              ...prev,
              {
                id: `tg_${Date.now()}`,
                name: `${customGuestName.trim()}(추가)`,
                baseAvg: Number(customGuestAvg) || 150,
              },
            ]);
            setCustomGuestName('');
            setCustomGuestAvg(150);
          };

          const generateBalancedTeams = () => {
            if (effectiveTeamPool.length === 0) {
              showToast('팀에 배정할 인원을 1명 이상 선택해주세요.');
              return;
            }
            const count = Math.max(2, Math.min(8, Number(teamCount) || 2));
            const sorted = [...effectiveTeamPool].sort((a, b) => b.baseAvg - a.baseAvg);
            const buckets = Array.from({ length: count }, () => []);
            sorted.forEach((player, idx) => {
              const round = Math.floor(idx / count);
              const pos = idx % count;
              const teamIdx = round % 2 === 0 ? pos : count - 1 - pos;
              buckets[teamIdx].push(player);
            });
            setTeams(buckets);
            showToast(`${effectiveTeamPool.length}명 기준 ${count}개 팀 편성이 완료되었습니다.`);
          };

          // 정산 계산
          const settlementData = useMemo(() => {
            if (!currentSession) return { rows: [], grandTotal: 0, totalGamesPlayed: 0 };
            const totalGamesPlayed = sessionStats.reduce((sum, p) => sum + p.gameCount, 0);
            const extraPerPerson =
              sessionStats.length > 0
                ? Math.ceil((currentSession.extraFund || 0) / sessionStats.length / 100) * 100
                : 0;

            const rows = sessionStats.map((player) => {
              const gameCost = (currentSession.gameFee || 0) * player.gameCount;
              const shoeCost = player.shoeRental ? shoeRentalFee : 0;
              const sideCost = currentSession.sidePotFee || 0;
              const total = gameCost + shoeCost + sideCost + extraPerPerson;
              return { ...player, gameCost, shoeCost, sideCost, extraPerPerson, total };
            });

            const grandTotal = rows.reduce((acc, r) => acc + r.total, 0);
            return { rows, grandTotal, totalGamesPlayed };
          }, [currentSession, sessionStats, shoeRentalFee]);

          const handleCopySettlement = async () => {
            if (!currentSession) return;
            const lines = [
              `🎳 [KOBO 정산 안내]`,
              `📅 ${currentSession.date} (${currentSession.title})`,
              `👥 참석: ${settlementData.rows.length}명 / 총 ${settlementData.totalGamesPlayed}게임`,
              `💰 1게임비: ${(currentSession.gameFee || 0).toLocaleString()}원 / 대회·사이드비: ${(currentSession.sidePotFee || 0).toLocaleString()}원`,
              ...(regularAccount.trim() ? [`💳 정기전 계좌: ${regularAccount.trim()}`] : []),
              ...(presidentPhone.trim() ? [`📞 문의(회장): ${presidentPhone.trim()}`] : []),
              `────────────────────`,
              ...settlementData.rows.map(
                (r) =>
                  `• ${r.name} (${r.gameCount}G): ${r.total.toLocaleString()}원${
                    r.shoeRental ? ' (대화료 포함)' : ''
                  }`
              ),
              `────────────────────`,
              `총 합계: ${settlementData.grandTotal.toLocaleString()}원`,
            ];

            const fullText = lines.join('\n');
            const success = await copyTextSafely(fullText);

            if (success) {
              setCopiedNotice(true);
              setTimeout(() => setCopiedNotice(false), 2500);
              showToast('카톡 정산문이 클립보드에 복사되었습니다!');
            } else {
              setManualTextModal({
                title: '카톡 정산문 텍스트',
                text: fullText,
              });
            }
          };

          const filteredMembersList = useMemo(() => {
            return effectiveMembers
              .filter((m) => {
                if (memberFilter === 'active') return m.status !== 'dormant';
                if (memberFilter === 'dormant') return m.status === 'dormant';
                return true;
              })
              .sort((a, b) => {
                if (memberSortBy === 'avgDesc') return b.baseAvg - a.baseAvg || a.name.localeCompare(b.name, 'ko');
                if (memberSortBy === 'avgAsc') return a.baseAvg - b.baseAvg || a.name.localeCompare(b.name, 'ko');
                if (memberSortBy === 'handiDesc') return b.handicap - a.handicap || a.name.localeCompare(b.name, 'ko');
                return a.name.localeCompare(b.name, 'ko');
              });
          }, [effectiveMembers, memberFilter, memberSortBy]);

          // 개인 기록 대시보드용 데이터 (현재 학기 + 이전 학기 전체 통합)
          const sortedMembersForSelect = useMemo(
            () => [...members].sort((a, b) => a.name.localeCompare(b.name, 'ko')),
            [members]
          );

          useEffect(() => {
            if (
              sortedMembersForSelect.length > 0 &&
              !sortedMembersForSelect.some((m) => m.id === selectedProfileMemberId)
            ) {
              setSelectedProfileMemberId(sortedMembersForSelect[0].id);
            }
          }, [sortedMembersForSelect, selectedProfileMemberId]);

          const personalProfileData = useMemo(() => {
            const member = members.find((m) => m.id === selectedProfileMemberId) || members[0];
            if (!member) return null;

            const currentSemesterLogs = [...sessions]
              .sort((a, b) => a.date.localeCompare(b.date))
              .map((sess) => {
                const rec = sess.records.find((r) => r.memberId === member.id);
                if (!rec) return null;
                const played = rec.scores.map((v) => Number(v) || 0).filter((v) => v > 0);
                if (played.length === 0) return null;
                const rawTotal = played.reduce((a, b) => a + b, 0);
                const rawAvg = Number((rawTotal / played.length).toFixed(1));
                const finalTotal = rawTotal + member.handicap * played.length;
                const finalAvg = Number((finalTotal / played.length).toFixed(1));
                return {
                  semesterName: currentSemesterName,
                  sessionId: sess.id,
                  date: sess.date,
                  title: sess.title,
                  scores: played,
                  gameCount: played.length,
                  rawAvg,
                  finalAvg,
                  highGame: Math.max(...played),
                };
              })
              .filter(Boolean);

            const archivedLogs = [...archivedSemesters]
              .reverse()
              .flatMap((sem) => {
                const snapMember = sem.membersSnapshot?.find((m) => m.id === member.id) || member;
                return [...sem.sessions]
                  .sort((a, b) => a.date.localeCompare(b.date))
                  .map((sess) => {
                    const rec = sess.records.find((r) => r.memberId === member.id);
                    if (!rec) return null;
                    const played = rec.scores.map((v) => Number(v) || 0).filter((v) => v > 0);
                    if (played.length === 0) return null;
                    const rawTotal = played.reduce((a, b) => a + b, 0);
                    const rawAvg = Number((rawTotal / played.length).toFixed(1));
                    const finalTotal = rawTotal + snapMember.handicap * played.length;
                    const finalAvg = Number((finalTotal / played.length).toFixed(1));
                    return {
                      semesterName: sem.name,
                      sessionId: sess.id,
                      date: sess.date,
                      title: sess.title,
                      scores: played,
                      gameCount: played.length,
                      rawAvg,
                      finalAvg,
                      highGame: Math.max(...played),
                    };
                  })
                  .filter(Boolean);
              });

            const allLogs = [...archivedLogs, ...currentSemesterLogs].sort((a, b) =>
              a.date.localeCompare(b.date)
            );
            const allGamesList = allLogs.flatMap((log) =>
              log.scores.map((sc, idx) => ({
                label: `${log.date.slice(5)} ${idx + 1}G`,
                title: log.title,
                score: sc,
              }))
            );

            const totalGames = allGamesList.length;
            const totalRaw = allGamesList.reduce((acc, g) => acc + g.score, 0);
            const overallRawAvg = totalGames > 0 ? Number((totalRaw / totalGames).toFixed(1)) : 0;
            const overallFinalAvg =
              totalGames > 0
                ? Number(
                    (
                      allLogs.reduce((acc, l) => acc + l.finalAvg * l.gameCount, 0) / totalGames
                    ).toFixed(1)
                  )
                : 0;
            const highGame = totalGames > 0 ? Math.max(...allGamesList.map((g) => g.score)) : 0;
            const recentGames = allGamesList.slice(-10);
            const recentAvg =
              recentGames.length > 0
                ? Number(
                    (recentGames.reduce((acc, g) => acc + g.score, 0) / recentGames.length).toFixed(1)
                  )
                : 0;

            return {
              member,
              allLogs,
              recentGames,
              totalSessions: allLogs.length,
              totalGames,
              overallRawAvg,
              overallFinalAvg,
              recentAvg,
              highGame,
            };
          }, [members, selectedProfileMemberId, sessions, currentSemesterName, archivedSemesters]);

          // 초기 입장 화면
          if (!role) {

                    },
                    h(

                    : h(

                        : h(

                { className: 'fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4' },
                h(
                  'form',
                  { onSubmit: handleUpdateSessionInfo, className: 'w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-5 shadow-2xl space-y-3' },
                  h(
                    'div',
                    { className: 'flex items-center justify-between' },
                    h('h3', { className: 'font-extrabold text-base text-slate-900' }, '정기전 회차 정보 수정'),
                    h('button', { type: 'button', onClick: () => setShowEditSessionModal(false), className: 'p-1 rounded-lg text-slate-400' }, Icons.X('w-4 h-4'))
                  ),
                  h('input', {
                    type: 'date',
                    required: true,
                    value: editSessionDate,
                    onChange: (e) => setEditSessionDate(e.target.value),
                    className: 'w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold',
                  }),
                  h('input', {
                    type: 'text',
                    required: true,
                    placeholder: '회차 이름',
                    value: editSessionTitle,
                    onChange: (e) => setEditSessionTitle(e.target.value),
                    className: 'w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold',
                  }),
                  h(
                    'div',
                    { className: 'flex gap-2 pt-1' },
                    h('button', { type: 'button', onClick: () => setShowEditSessionModal(false), className: 'flex-1 py-2.5 rounded-xl bg-slate-100 text-xs font-bold' }, '취소'),
                    h('button', { type: 'submit', className: 'flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold' }, '수정 저장')
                  )
                )
              ),

            // 신규 회원 등록 모달
            isAdmin &&
              showAddMember &&
              h(
                'div',
                { className: 'fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4' },
                h(
                  'form',
                  { onSubmit: handleAddMember, className: 'w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-5 shadow-2xl space-y-3' },
                  h(
                    'div',
                    { className: 'flex items-center justify-between' },
                    h('h3', { className: 'font-extrabold text-base text-slate-900' }, '신규 회원 / 게스트 등록'),
                    h('button', { type: 'button', onClick: () => setShowAddMember(false), className: 'p-1 rounded-lg text-slate-400' }, Icons.X('w-4 h-4'))
                  ),
                  h('input', {
                    type: 'text',
                    required: true,
                    placeholder: '회원 성명',
                    value: newMemberName,
                    onChange: (e) => setNewMemberName(e.target.value),
                    className: 'w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold',
                  }),
                  h(
                    'div',
                    { className: 'grid grid-cols-2 gap-2' },
                    h('input', {
                      type: 'number',
                      placeholder: '기준 에버리지',
                      value: newMemberAvg,
                      onChange: (e) => setNewMemberAvg(e.target.value),
                      className: 'w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold',
                    }),
                    h('input', {
                      type: 'number',
                      placeholder: '핸디캡',
                      value: newMemberHandicap,
                      onChange: (e) => setNewMemberHandicap(e.target.value),
                      className: 'w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold',
                    })
                  ),
                  h(
                    'label',
                    { className: 'flex items-center gap-2 text-xs text-slate-700' },
                    h('input', {
                      type: 'checkbox',
                      checked: newMemberIsGuest,
                      onChange: (e) => setNewMemberIsGuest(e.target.checked),
                    }),
                    '게스트로 등록'
                  ),
                  h(
                    'div',
                    { className: 'flex gap-2 pt-1' },
                    h('button', { type: 'button', onClick: () => setShowAddMember(false), className: 'flex-1 py-2.5 rounded-xl bg-slate-100 text-xs font-bold' }, '취소'),
                    h('button', { type: 'submit', className: 'flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold' }, '등록 완료')
                  )
                )
              ),

            // 회원 영구 삭제 확인 모달
            isAdmin &&
              deleteTargetMember &&
              h(
                'div',
                { className: 'fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4' },
                h(
                  'div',
                  { className: 'w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-5 shadow-2xl space-y-3' },
                  h('h3', { className: 'font-extrabold text-base text-slate-900' }, `${deleteTargetMember.name} 회원 영구 삭제`),
                  h(
                    'p',
                    { className: 'text-xs text-slate-600 leading-relaxed' },
                    '영구 삭제 시 모든 정기전 기록, 레인표, 팀 편성에서 완전히 삭제됩니다. 기록을 남기려면 휴면 전환을 이용하세요.'
                  ),
                  h(
                    'div',
                    { className: 'flex gap-2 pt-1' },
                    h(
                      'button',
                      {
                        type: 'button',
                        onClick: () => setDeleteTargetMember(null),
                        className: 'flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs',
                      },
                      '취소'
                    ),
                    h(
                      'button',
                      {
                        type: 'button',
                        onClick: handleConfirmDeleteMember,
                        className: 'flex-1 py-2.5 rounded-xl bg-rose-600 text-white font-extrabold text-xs',
                      },
                      '영구 삭제'
                    )
                  )
                )
              ),

            // 레인 빈 슬롯 수동 배정 모달
            isAdmin &&
              assignModalTarget &&
              h(
                'div',
                { className: 'fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4' },
                h(
                  'div',
                  { className: 'w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-5 shadow-2xl space-y-3' },
                  h(
                    'div',
                    { className: 'flex items-center justify-between' },
                    h('h3', { className: 'font-extrabold text-base' }, `${assignModalTarget.laneNum}레인 · ${assignModalTarget.slotIdx + 1}번 자리 배정`),
                    h('button', { type: 'button', onClick: () => setAssignModalTarget(null), className: 'p-1 rounded-lg text-slate-400' }, Icons.X('w-4 h-4'))
                  ),
                  h(
                    'div',
                    { className: 'max-h-64 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-2xl' },
                    unassignedActiveMembers.length === 0
                      ? h('div', { className: 'p-6 text-center text-xs text-slate-400' }, '미배정된 활동중 회원이 없습니다.')
                      : unassignedActiveMembers.map((m) =>
                          h(
                            'button',
                            {
                              key: m.id,
                              type: 'button',
                              onClick: () => handleAssignMemberToLaneSlot(assignModalTarget.laneNum, assignModalTarget.slotIdx, m.id),
                              className: 'w-full px-3.5 py-2.5 flex items-center justify-between hover:bg-blue-50 text-left',
                            },
                            h('span', { className: 'font-bold text-sm' }, m.name),
                            h('span', { className: 'text-xs font-extrabold text-blue-600' }, `에버 ${m.baseAvg}`)
                          )
                        )
                  )
                )
              ),

            // 레인 배정표 PNG 미리보기 모달
            lanePreviewImage &&
              h(
                'div',
                { className: 'fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4' },
                h(
                  'div',
                  { className: 'w-full max-w-2xl bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]' },
                  h(
                    'div',
                    { className: 'px-5 py-3.5 border-b border-slate-200 flex items-center justify-between' },
                    h('h3', { className: 'font-extrabold text-sm' }, '레인 배정표 이미지 미리보기'),
                    h('button', { type: 'button', onClick: () => setLanePreviewImage(null), className: 'p-1.5 rounded-lg text-slate-400' }, Icons.X('w-5 h-5'))
                  ),
                  h('div', { className: 'p-4 overflow-y-auto bg-slate-50 flex justify-center' }, h('img', { src: lanePreviewImage, alt: '레인 배정표', className: 'max-w-full h-auto rounded-xl border border-slate-200' })),
                  h(
                    'div',
                    { className: 'px-5 py-3.5 border-t border-slate-200 flex justify-end gap-2' },
                    h('button', { type: 'button', onClick: () => setLanePreviewImage(null), className: 'px-4 py-2 rounded-xl bg-slate-100 text-xs font-bold' }, '닫기'),
                    h('a', { href: lanePreviewImage, download: `KOBO_레인배정표_${currentSession?.date || 'lane'}.png`, className: 'px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-extrabold' }, 'PNG 저장')
                  )
                )
              ),

            // TOP 10 순위표 PNG 미리보기 모달
            top10PreviewImage &&
              h(
                'div',
                { className: 'fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4' },
                h(
                  'div',
                  { className: 'w-full max-w-xl bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]' },
                  h(
                    'div',
                    { className: 'px-5 py-3.5 border-b border-slate-200 flex items-center justify-between' },
                    h('h3', { className: 'font-extrabold text-sm' }, `${currentSession?.title} TOP 10 순위표 이미지`),
                    h('button', { type: 'button', onClick: () => setTop10PreviewImage(null), className: 'p-1.5 rounded-lg text-slate-400' }, Icons.X('w-5 h-5'))
                  ),
                  h('div', { className: 'p-4 overflow-y-auto bg-slate-50 flex justify-center' }, h('img', { src: top10PreviewImage, alt: 'TOP 10 순위표', className: 'max-w-full h-auto rounded-xl border border-slate-200' })),
                  h(
                    'div',
                    { className: 'px-5 py-3.5 border-t border-slate-200 flex justify-end gap-2' },
                    h('button', { type: 'button', onClick: () => setTop10PreviewImage(null), className: 'px-4 py-2 rounded-xl bg-slate-100 text-xs font-bold' }, '닫기'),
                    h('a', { href: top10PreviewImage, download: `KOBO_TOP10_${currentSession?.date || 'rank'}.png`, className: 'px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-extrabold' }, 'PNG 저장')
                  )
                )
              )
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
      })();
    </script>
  </body>
</html>
